<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>우리아이 성장보고서</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; font-family: 'Noto Sans KR', sans-serif; background-color: #fcfcfc; }
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; transition: opacity 1s ease; }
        #main { display: none; padding: 40px 20px; text-align: center; }
        .btn-record { width: 100%; padding: 20px; background: linear-gradient(135deg, #FF6B6B, #FF8E8E); color: white; border: none; border-radius: 18px; font-size: 18px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div id="splash">
        <img src="https://pkryjtjsaajalqqzzoyk.supabase.co/storage/v1/object/public/growth-report-illust/family-illust.png" style="width: 300px; margin-bottom: 15px;">
        <h2 style="font-size: 24px; color: #333;">우리아이 성장보고서</h2>
        <p style="color: #888;">함께 성장하는 소중한 기록</p>
    </div>

    <div id="main">
        <h1 style="font-size: 24px; color: #222; margin-bottom: 30px;">실시간 대시보드</h1>
        <div style="background: white; padding: 25px; border-radius: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); margin-bottom: 40px;">
            <div id="status" style="color: #4CAF50; font-weight: bold;">연결 완료 ✅</div>
        </div>
        <button class="btn-record" onclick="addLog()">오늘의 기록 추가</button>
    </div>

    <script>
        const supabaseUrl = 'https://pkryjtjsaajalqqzzoyk.supabase.co';
        // [필독] 사장님의 실제 anon 키를 아래 따옴표 안에 꼭 넣어주세요!
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrcnlqdGpzYWFqYWxxcXp6b3lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MDgwMjYsImV4cCI6MjA4NTE4NDAyNn0.v8_aUSCd_D0Zqtiq5bGSrkhMRHCQI2e-Lyq1i6Mpqjs'; 
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        window.onload = () => {
            setTimeout(() => {
                const splash = document.getElementById('splash');
                const main = document.getElementById('main');
                
                if (splash) splash.style.opacity = '0';
                
                setTimeout(() => {
                    if (splash) splash.style.display = 'none';
                    if (main) main.style.display = 'block'; // 메인 화면 강제 활성화!
                }, 1000);
            }, 2500);
        };

        async function addLog() {
            const h = prompt("아이의 키(cm):", "");
            const w = prompt("아이의 몸무게(kg):", "");
            if (h && w) {
                const { error } = await _supabase.from('growth_logs').insert([{ height: parseFloat(h), weight: parseFloat(w) }]);
                if (error) alert("실패: " + error.message);
                else {
                    alert("기록 성공! ✨ 사장님, 드디어 해내셨습니다!");
                    location.reload();
                }
            }
        }
    </script>
</body>
</html>
