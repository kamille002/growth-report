<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우리아이 성장보고서</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="splash">
        <img src="https://pkryjtjsaajalqqzzoyk.supabase.co/storage/v1/object/public/growth-report-illust/family-illust.png" style="width:350px; border-radius:20px; margin-bottom:20px;">
        <h2 style="color:var(--primary); font-size: 20px;">아이의 내일이 더 기대되는 시간</h2>
        <p style="color:#888;">우리아이 성장보고서</p>
    </div>

    <div class="app-container">
        <section id="home" class="app-section active">
            <h2 style="font-size:18px;">실시간 대시보드</h2>
            <div class="card"><canvas id="growthChart"></canvas></div>
            <button class="btn" onclick="showAddLog()">📸 오늘의 성장 기록</button>
            <div id="history-list" style="margin-top:30px;"></div>
        </section>

        <section id="log" class="app-section"><h2>데일리 로그</h2><p>준비 중...</p></section>
        <section id="map" class="app-section"><h2>안심 병원/약국</h2><p>준비 중...</p></section>
        <section id="ai" class="app-section"><h2>AI 육아 튜터링</h2><p>준비 중...</p></section>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('home')"><span>🏠</span><span class="nav-label">홈</span></div>
            <div class="nav-item" onclick="switchTab('log')"><span>📝</span><span class="nav-label">기록</span></div>
            <div class="nav-item" onclick="switchTab('map')"><span>📍</span><span class="nav-label">병원찾기</span></div>
            <div class="nav-item" onclick="switchTab('ai')"><span>🤖</span><span class="nav-label">AI상담</span></div>
        </nav>
    </div>

    <script src="app.js"></script>
    <script src="log.js"></script>
</body>
</html>
