<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리아이 성장보고서</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="splash-screen" class="splash-container">
        <div class="splash-content">
            <h1 class="splash-title">우리아이 성장일기</h1>
            <p class="splash-subtitle">아이의 내일이 더 기대되는 시간</p>
        </div>
        <div class="splash-footer">
            made with <span class="brand-name">ONDOLCARE</span>
        </div>
    </div>

    <div id="main-content">
        <header class="main-header">
            <div class="header-content">
                <h1 class="main-logo">Growth Report</h1>
                
                <div class="family-image-container">
                    <img src="https://pkryjtjaajalqqzzoyk.supabase.co/storage/v1/object/public/growth-report-illust/family-illust.png" alt="우리 가족" class="family-image">
                </div>

                <div id="ai-message" class="ai-message-box">
                    "재욱이가 오늘 평소보다 <strong>1시간 더</strong> 잤어요.<br>
                    성장에 아주 좋은 신호입니다."
                </div>
            </div>
        </header>

        <section class="quick-log">
            <button class="log-btn">MILK</button>
            <button class="log-btn">DIAPER</button>
            <button class="log-btn">SLEEP</button>
        </section>

        <section class="safe-zone">
            <div class="section-header">
                <h2>Safe Zone</h2>
                <button class="view-all">VIEW ALL</button>
            </div>
            <div id="map-container" class="map-box">
                <p class="map-placeholder">주변 병원/약국을 찾는 중...</p>
            </div>
        </section>

        <footer class="main-footer">
            <p>ONDOLCARE BY CHO YOUNG BOK</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
